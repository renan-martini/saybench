name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./...
      - name: build
        run: go build ./cmd/saybench
      - name: end-to-end smoke (offline fake provider)
        run: |
          ./saybench stt -providers fake -manifest golden/manifest.jsonl -report base.json
          ./saybench stt -providers fake -manifest golden/manifest.jsonl -report again.json -format json | grep -q '"keyterm_recall"'
          ./saybench compare base.json again.json -max-wer-regression 0.0
          ./saybench html -o dash.html base.json again.json
          grep -q "saybench dashboard" dash.html
          ./saybench show base.json | grep -q "KEYTERM RECALL"
          ./saybench stream -providers fake-stream -manifest golden/manifest.jsonl -report stream.json
          ./saybench show stream.json | grep -q "INTERIM SURVIVAL"
          if ./saybench compare base.json stream.json; then echo "cross-mode compare must fail" && exit 1; fi
          ./saybench llm -targets fake-llm -prompts llm/golden.jsonl -report llm.json
          ./saybench llm -targets fake-llm -warmup=false -prompts llm/golden.jsonl -report llmcold.json
          ./saybench compare llmcold.json llm.json 2>&1 | grep -q "warning: comparing"
          ./saybench s2s -providers fake-s2s -manifest golden/manifest.jsonl -report s2s.json
          ./saybench show s2s.json | grep -q "V2V FIRST AUDIO"
          ./saybench html -o s2sdash.html s2s.json
          grep -q "saybench dashboard" s2sdash.html
          ./saybench s2s -providers fake-s2s -score echo -manifest golden/manifest.jsonl -report s2secho.json
          ./saybench show s2secho.json | grep -q "ECHO WER"
          ./saybench compare s2s.json s2secho.json 2>&1 | grep -q "tasks differ"
          ./saybench tts -providers fake-tts -texts llm/golden.jsonl -report tts.json
          ./saybench show tts.json | grep -q "TTFA"
          ./saybench stt -providers fake -normalize digits -manifest golden/manifest.jsonl -report norm.json
          ./saybench compare base.json norm.json 2>&1 | grep -q "different scoring normalization"
          ./saybench stt -providers fake -judge fake-llm -manifest golden/manifest.jsonl -report judged.json
          ./saybench show -format json judged.json | grep -q '"judge_scored": true'
          ./saybench compare base.json judged.json 2>&1 | grep -q "different judges"
          ./saybench s2s -providers fake-s2s -barge-in -manifest golden/manifest.jsonl -report barge.json | grep -q "BARGE-IN STOP"
          ./saybench compare s2s.json barge.json 2>&1 | grep -q "barge-in"
          printf '%s\n%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"run_stt","arguments":{"providers":"fake","manifest":"golden/manifest.jsonl"}}}' | ./saybench mcp | grep -q '"serverInfo"' 
          ./saybench show llm.json | grep -q "TTFT"
          ./saybench html -o llmdash.html llm.json
          grep -q "saybench dashboard" llmdash.html
